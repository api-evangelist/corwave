aid: corwave
name: CorWave
description: 'CorWave SA is a French clinical-stage medical device company, incorporated
  in 2012 by the startup studio MD Start and headquartered in Clichy, France, that
  develops implantable cardiac assist pumps for patients with advanced heart failure.
  Its patented wave membrane technology — a biomimetic polymer membrane driven by an
  electromagnetic actuator, inspired by the undulating movement of marine animals —
  produces truly pulsatile, physiological blood flow, differentiating the CorWave LVAS
  and Nemo pumps from commercially available rotary-pump LVADs. The company has raised
  more than EUR 80 million, operates an urban manufacturing facility in Clichy, employs
  more than 90 people, and announced the first in-human implantation of its Left Ventricular
  Assist System in 2025. CorWave LVAS remains an investigational device and is not
  approved for commercial use in any country. CorWave publishes no public API, SDK,
  developer portal, or machine-readable specification.'
